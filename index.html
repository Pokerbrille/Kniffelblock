<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kniffelblock</title>
<meta name="robots" content="noindex,nofollow">

<style>
:root{--paper:#f7f8fc;--ink:#1a2140;--accent:#3347ff;--on:#fff;--gold:#ffc93c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171b2e;--ink:#eef0fb;--accent:#7a89ff;--on:#10142a}}
:root[data-theme="dark"]{--paper:#171b2e;--ink:#eef0fb;--accent:#7a89ff;--on:#10142a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
:root{--line:color-mix(in srgb,var(--ink) 16%,transparent);--soft:color-mix(in srgb,var(--ink) 6%,var(--paper));--bg:color-mix(in srgb,var(--ink) 9%,var(--paper))}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.3 system-ui,system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;padding:10px 10px 12px}
h1{font:800 28px/1 "system-ui",system-ui,sans-serif;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.die{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px;transform:rotate(-8deg)}
.die i{width:5px;height:5px;border-radius:50%;background:var(--on);place-self:center}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bt{font:700 14px system-ui,sans-serif;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:40px}
.bt.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}
.bt.warn{border-color:#d62839;color:#d62839}
.bt:disabled{opacity:.4}
.bt:focus-visible,.c:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.rank{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);padding:5px 11px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip b{font-family:"system-ui",sans-serif}
.chip.lead{background:var(--gold);border-color:var(--gold);color:#2a2200}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.wrap{flex:1;min-height:0;overflow:auto;border:2px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 0 0 4px var(--bg),0 0 0 5.5px var(--line)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;min-width:74px;height:46px;background:var(--paper)}
thead th{position:sticky;top:0;z-index:2;border-bottom:2px solid var(--ink);font:700 14px "system-ui",system-ui,sans-serif;padding:0 6px;border-top:5px solid var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.lab{position:sticky;left:0;z-index:1;text-align:left!important;padding:0 10px!important;min-width:118px;font-weight:700;border-right:2px solid var(--ink)}
thead .lab{z-index:3;border-top:5px solid var(--ink)}
.lab small{display:inline-block;margin-left:6px;color:var(--accent);font-weight:700}
tr.band .lab{background:var(--ink);color:var(--paper);height:30px;font:700 13px system-ui,sans-serif;letter-spacing:.02em}
tr.band th{border:0}
tr.sum td,tr.sum .lab{background:var(--soft);font-weight:700}
tr.sum td{font-family:"system-ui",sans-serif}
tr.total td,tr.total .lab{position:sticky;bottom:0;z-index:2;background:var(--accent);color:var(--on);border-top:2px solid var(--ink);height:54px;font:800 22px "system-ui",sans-serif}
tr.total .lab{z-index:4;font-size:16px}
tr.total td.top{background:var(--gold);color:#2a2200}
.c{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;min-height:46px;line-height:46px;cursor:pointer;font:700 19px "system-ui",sans-serif;-webkit-tap-highlight-color:transparent}
.c:empty::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);vertical-align:middle}
.c.z{color:var(--accent);font-size:17px}
.c:active{background:var(--soft)}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.pn{background:var(--paper);width:min(560px,100%);max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border:2px solid var(--ink);border-bottom:0}
.pn h2{font:800 20px "system-ui",sans-serif;margin:0 0 10px}
.pn h3{font:700 16px "system-ui",sans-serif;margin:20px 0 8px;padding-top:12px;border-top:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid .bt{padding:0;height:52px;font:800 20px "system-ui",sans-serif;border-radius:14px}
.grid .bt small{display:block;font:500 11px system-ui,sans-serif;opacity:.7}
.grid .bt.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
input[type=text],input[type=number],select{font:500 16px system-ui,sans-serif;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;min-width:0}
input[type=text]{flex:1 1 120px}
input[type=number]{width:72px}
input[type=color]{width:46px;height:40px;border:2px solid var(--ink);border-radius:10px;padding:2px;background:var(--paper)}
.ib{min-width:40px;padding:0 8px}
.hint{font-size:13px;opacity:.7;margin:2px 0 8px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.tabs{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.tab{all:unset;flex:1;text-align:center;padding:9px;font:700 15px system-ui,sans-serif;cursor:pointer}
.tab.on{background:var(--ink);color:var(--paper)}
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.stat{--pc:var(--ink);padding-bottom:12px}
.stat h4{font:800 17px "system-ui",sans-serif;margin:16px 10px 8px}
.stat td,.stat th{height:40px}
.stat td.hi{background:var(--gold);color:#2a2200;font-weight:700}
.empty{padding:20px;opacity:.8;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1><span class="die"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="gameTitle">Kniffel</span></h1>
  <div class="row" style="margin:0"><button class="bt" id="bNew">Neues Spiel</button><button class="bt pri" id="bSet">Einstellungen</button></div>
</header>
<div class="tabs"><button class="tab on" id="t1" data-t="1">Block</button><button class="tab" id="t2" data-t="2">Statistik</button></div>
<div class="rank" id="rank"></div>
<div class="wrap" id="blk"><table id="tb"></table></div>
<div class="wrap stat" id="stats" hidden></div>

<div class="ov" id="ovPick" hidden><div class="pn" id="pick"></div></div>
<div class="ov" id="ovSet" hidden><div class="pn" id="set"></div></div>

<script>
const $=s=>document.querySelector(s),KEY='kniffelblock-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const upper=()=>['Einser','Zweier','Dreier','Vierer','Fünfer','Sechser'].map((n,i)=>({id:'u'+(i+1),name:n,sec:'u',t:'m',v:i+1}));
const std=()=>upper().concat([
 {id:'l1',name:'Dreierpasch',sec:'l',t:'s',v:0},{id:'l2',name:'Viererpasch',sec:'l',t:'s',v:0},
 {id:'l3',name:'Full House',sec:'l',t:'f',v:25},{id:'l4',name:'Kleine Straße',sec:'l',t:'f',v:30},
 {id:'l5',name:'Große Straße',sec:'l',t:'f',v:40},{id:'l6',name:'Kniffel',sec:'l',t:'f',v:50},{id:'l7',name:'Chance',sec:'l',t:'s',v:0}]);
const stdYatzy=()=>upper().concat([
 {id:'l1',name:'Ein Paar',sec:'l',t:'y',rule:'pair',v:0},{id:'l2',name:'Zwei Paare',sec:'l',t:'y',rule:'twoPairs',v:0},
 {id:'l3',name:'Dreierpasch',sec:'l',t:'y',rule:'three',v:0},{id:'l4',name:'Viererpasch',sec:'l',t:'y',rule:'four',v:0},
 {id:'l5',name:'Full House',sec:'l',t:'y',rule:'house',v:0},{id:'l6',name:'Kleine Straße',sec:'l',t:'y',rule:'small',v:15},
 {id:'l7',name:'Große Straße',sec:'l',t:'y',rule:'large',v:20},{id:'l8',name:'Chance',sec:'l',t:'y',rule:'chance',v:0},
 {id:'l9',name:'Yatzy',sec:'l',t:'y',rule:'yatzy',v:50}]);
const mk=i=>({n:'Spieler '+i,s:{}});
const fresh=()=>({players:[mk(1),mk(2)],fields:std(),variant:'kniffel',bonus:{on:true,thr:63,val:35},theme:null});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.players)S=fresh();
S.variant=S.variant||'kniffel';
S.hist=S.hist||[];let VIEW=1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const PRE=[['Klassisch','#3347ff','#f7f8fc','#1a2140'],['Rot','#d62839','#fffaf5','#2b1414'],['Minze','#0e8f7e','#f0f8f6','#10312c'],['Beere','#c2185b','#fdf2f7','#2c1020'],['Sonne','#f08a00','#fff8e8','#2d2410'],['Nacht','#ff8a4c','#1b1a24','#f4efe6']];
const pcol=i=>`hsl(${(i*47+225)%360} 72% 52%)`;
function applyTheme(){const r=document.documentElement.style,t=S.theme;
 if(!t){['--accent','--paper','--ink','--on'].forEach(k=>r.removeProperty(k));return}
 r.setProperty('--accent',t.accent);r.setProperty('--paper',t.paper);r.setProperty('--ink',t.ink);
 const h=t.accent.slice(1),L=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000;
 r.setProperty('--on',L>150?'#1a1a1a':'#fff');}
function calc(p){let u=0,l=0;S.fields.forEach(f=>{const v=p.s[f.id]||0;f.sec=='u'?u+=v:l+=v});
 const b=S.bonus.on&&u>=S.bonus.thr?S.bonus.val:0;return{u,l,b,total:u+b+l}}
function render(){applyTheme();$('#gameTitle').textContent=S.variant==='yatzy'?'Yatzy':'Kniffel';document.title=S.variant==='yatzy'?'Yatzyblock':'Kniffelblock';const P=S.players,T=P.map(calc),max=Math.max(...T.map(t=>t.total));
 $('#rank').innerHTML=P.map((p,i)=>({p,i,t:T[i].total})).sort((a,b)=>b.t-a.t).map((x,k)=>`<div class="chip${k==0&&max>0?' lead':''}" style="--pc:${pcol(x.i)}"><span class="dot"></span>${esc(x.p.n)} <b>${x.t}</b></div>`).join('');
 const cell=(f,p,i)=>{const v=p.s[f.id];return `<td><button class="c${v===0?' z':''}" data-p="${i}" data-f="${esc(f.id)}" aria-label="${esc(f.name)}, ${esc(p.n)}">${v==null?'':v===0?'✗':v}</button></td>`};
 const frow=f=>`<tr><th class="lab" scope="row">${esc(f.name)}${f.t=='f'||(f.t=='y'&&['small','large','yatzy'].includes(f.rule))?`<small>${f.v}</small>`:''}</th>${P.map((p,i)=>cell(f,p,i)).join('')}</tr>`;
 const row=(cls,l,fn)=>`<tr class="${cls}"><th class="lab" scope="row">${l}</th>${T.map(fn).join('')}</tr>`;
 const U=S.fields.filter(f=>f.sec=='u'),L=S.fields.filter(f=>f.sec!='u'),band=n=>`<tr class="band"><th class="lab" colspan="${P.length+1}">${n}</th></tr>`;
 let h=`<thead><tr><th class="lab">Spiel</th>${P.map((p,i)=>`<th style="--pc:${pcol(i)}">${esc(p.n)}</th>`).join('')}</tr></thead><tbody>`;
 if(U.length){h+=band('Oberer Block')+U.map(frow).join('')+row('sum','Summe oben',t=>`<td>${t.u}</td>`);
  if(S.bonus.on)h+=row('sum',`Bonus ab ${S.bonus.thr}`,t=>`<td>${t.b?'+'+t.b:t.u+'/'+S.bonus.thr}</td>`)}
 if(L.length){h+=band('Unterer Block')+L.map(frow).join('')+row('sum','Summe unten',t=>`<td>${t.l}</td>`)}
 h+=row('total','Gesamt',t=>`<td class="${t.total==max&&max>0?'top':''}">${t.total}</td>`)+'</tbody>';
 $('#tb').innerHTML=h;$('#bNew').textContent=done()?'Spiel speichern':'Neues Spiel';stats();save()}
const show=(id,on)=>$(id).hidden=!on;
$('#tb').addEventListener('click',e=>{const b=e.target.closest('.c');if(!b)return;
 const p=S.players[+b.dataset.p],f=S.fields.find(x=>x.id==b.dataset.f),cur=p.s[f.id];let o=[];
 if(f.t=='m')for(let k=0;k<=5;k++)o.push([k*f.v,k?k*f.v:'✗',k?k+'×':'streichen']);
 else if(f.t=='f')o=[[0,'✗','streichen'],[f.v,f.v,'geschafft']];
 else if(f.t=='y')o=yatzyChoices(f);
 else{o.push([0,'✗','']);for(let k=5;k<=30;k++)o.push([k,k,''])}
 $('#pick').innerHTML=`<h2>${esc(f.name)} · ${esc(p.n)}</h2><div class="grid">${o.map(x=>`<button class="bt${cur===x[0]?' on':''}" data-v="${x[0]}">${x[1]}${x[2]?`<small>${x[2]}</small>`:''}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="bt" data-v="">Feld leeren</button><button class="bt" data-v="x">Schließen</button></div>`;
 $('#pick').onclick=ev=>{const q=ev.target.closest('[data-v]');if(!q)return;const v=q.dataset.v;
  if(v==='')delete p.s[f.id];else if(v!=='x')p.s[f.id]=+v;show('#ovPick',false);render()};
 show('#ovPick',true)});
['#ovPick','#ovSet'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target==$(id))show(id,false)}));
document.addEventListener('keydown',e=>{if(e.key=='Escape'){show('#ovPick',false);show('#ovSet',false)}});
let armed=null;
function twice(btn,label,fn){if(armed===btn){armed=null;fn();return}const o=btn.textContent;armed=btn;btn.textContent=label;
 setTimeout(()=>{if(armed===btn){armed=null;btn.textContent=o}},3000)}
const done=()=>S.fields.length>0&&S.players.every(p=>S.fields.every(f=>p.s[f.id]!=null));
$('#bNew').onclick=e=>twice(e.target,done()?'Speichern & neu?':'Wirklich leeren?',()=>{
 if(done()){S.hist.push({d:Date.now(),f:S.fields.map(f=>({id:f.id,n:f.name})),p:S.players.map(p=>({n:p.n.trim()||'?',s:{...p.s},t:calc(p).total}))});if(S.hist.length>500)S.hist.shift()}
 S.players.forEach(p=>p.s={});render()});
$('#bSet').onclick=()=>{renderSet();show('#ovSet',true)};
const TY={m:'Augen × 1–5',f:'Feste Punkte',s:'Augensumme',y:'Yatzy-Wertung'};
const YRULE={pair:'Ein Paar',twoPairs:'Zwei Paare',three:'Dreierpasch',four:'Viererpasch',house:'Full House',small:'Kleine Straße',large:'Große Straße',chance:'Chance',yatzy:'Yatzy'};
function yatzyChoices(f){const out=[[0,'✗','streichen']],r=f.rule;
 const add=(v,desc='')=>out.push([v,v,desc]);
 if(r==='pair')for(let n=1;n<=6;n++)add(2*n,n+'er-Paar');
 else if(r==='twoPairs')for(let a=1;a<=6;a++)for(let b=a+1;b<=6;b++)add(2*a+2*b,a+'er- und '+b+'er-Paar');
 else if(r==='three')for(let n=1;n<=6;n++)add(3*n,n+'er');
 else if(r==='four')for(let n=1;n<=6;n++)add(4*n,n+'er');
 else if(r==='house'){for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a!==b)add(2*a+3*b,'Paar '+a+'er, Drilling '+b+'er')}
 else if(r==='small')add(15,'1–2–3–4–5');
 else if(r==='large')add(20,'2–3–4–5–6');
 else if(r==='yatzy')add(f.v||50,'fünf gleiche');
 else if(r==='chance')for(let n=5;n<=30;n++)add(n);
 const m=new Map();out.sort((a,b)=>a[0]-b[0]).forEach(x=>{const q=m.get(x[0]);if(q)q[2]='';else m.set(x[0],[...x])});return [...m.values()];
}
function renderSet(){const th=S.theme||{accent:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),paper:getComputedStyle(document.documentElement).getPropertyValue('--paper').trim(),ink:getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()};
 const hx=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#888888';
 $('#set').innerHTML=`<h2>Grundeinstellungen</h2>
 <h3 style="margin-top:6px;border:0;padding:0">Spieler (${S.players.length}/10)</h3>
 ${S.players.map((p,i)=>`<div class="row"><span class="dot" style="--pc:${pcol(i)}"></span><input type="text" maxlength="14" value="${esc(p.n)}" data-k="pn" data-i="${i}" aria-label="Name Spieler ${i+1}"><button class="bt ib" data-a="pdel" data-i="${i}" ${S.players.length<2?'disabled':''} aria-label="Entfernen">✕</button></div>`).join('')}
 <button class="bt" data-a="padd" ${S.players.length>=10?'disabled':''}>+ Spieler</button>
 <h3>Felder</h3><p class="hint">Name, Art und Punkte jedes Feldes anpassen. Ob ein Feld oben (zählt für den Bonus) oder unten steht, wählst du hier.</p>
 ${S.fields.map((f,i)=>`<div class="row"><input type="text" maxlength="20" value="${esc(f.name)}" data-k="fn" data-i="${i}" aria-label="Feldname">
 <select data-k="ft" data-i="${i}">${Object.entries(TY).map(([k,v])=>`<option value="${k}"${f.t==k?' selected':''}>${v}</option>`).join('')}</select>
 ${f.t!='s'&&f.t!='y'?`<input type="number" min="1" value="${f.v}" data-k="fv" data-i="${i}" aria-label="${f.t=='m'?'Augenzahl':'Punkte'}">`:''}
 ${f.t=='y'?`<select data-k="yr" data-i="${i}">${Object.entries(YRULE).map(([k,v])=>`<option value="${k}"${f.rule==k?' selected':''}>${v}</option>`).join('')}</select>`:''}
 <select data-k="fs" data-i="${i}"><option value="u"${f.sec=='u'?' selected':''}>Oben</option><option value="l"${f.sec!='u'?' selected':''}>Unten</option></select>
 <button class="bt ib" data-a="fup" data-i="${i}" aria-label="Nach oben">↑</button><button class="bt ib" data-a="fdn" data-i="${i}" aria-label="Nach unten">↓</button><button class="bt ib" data-a="fdel" data-i="${i}" aria-label="Entfernen">✕</button></div>`).join('')}
 <div class="row"><button class="bt" data-a="fadd">+ Feld</button><button class="bt warn" data-a="fstd">Standard-Kniffel</button><button class="bt warn" data-a="ystd">Standard-Yatzy</button></div>
 <h3>Bonus</h3><div class="row"><label class="row" style="margin:0"><input type="checkbox" data-k="bo" ${S.bonus.on?'checked':''}> Bonus aktiv</label>
 ab <input type="number" min="0" value="${S.bonus.thr}" data-k="bt"> Punkten oben gibt es <input type="number" min="0" value="${S.bonus.val}" data-k="bv"></div>
 <h3>Farben</h3><div class="row">${PRE.map((p,i)=>`<button class="sw" data-a="pre" data-i="${i}" title="${p[0]}" aria-label="${p[0]}" style="background:linear-gradient(135deg,${p[1]} 50%,${p[2]} 50%)"></button>`).join('')}</div>
 <div class="row"><label>Akzent <input type="color" value="${hx(th.accent)}" data-k="c" data-c="accent"></label><label>Papier <input type="color" value="${hx(th.paper)}" data-k="c" data-c="paper"></label><label>Schrift <input type="color" value="${hx(th.ink)}" data-k="c" data-c="ink"></label></div>
 <div class="row"><button class="bt" data-a="tres">Farben zurücksetzen</button></div>
  <div class="row"><button class="bt warn" data-a="allclr">Alle gespeicherten Daten löschen</button></div>
 <div class="row" style="margin-top:18px"><button class="bt pri" data-a="done" style="flex:1">Fertig</button></div>`}
const SB=$('#set');
SB.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||t.tagName=='SELECT'||t.type=='checkbox')return;const i=+t.dataset.i;
 if(k=='pn')S.players[i].n=t.value;else if(k=='fn')S.fields[i].name=t.value;
 else if(k=='fv')S.fields[i].v=Math.max(1,+t.value||1);else if(k=='bt')S.bonus.thr=+t.value||0;else if(k=='bv')S.bonus.val=+t.value||0;
 else if(k=='c'){S.theme=S.theme||{accent:'#3347ff',paper:'#f7f8fc',ink:'#1a2140'};S.theme[t.dataset.c]=t.value}
 render()});
SB.addEventListener('change',e=>{const t=e.target,k=t.dataset.k,i=+t.dataset.i;if(!k)return;
 if(k=='ft'){S.fields[i].t=t.value;if(t.value!='s'&&t.value!='y'&&!S.fields[i].v)S.fields[i].v=t.value=='m'?1:25;if(t.value=='y'&&!S.fields[i].rule)S.fields[i].rule='chance'}
 else if(k=='yr')S.fields[i].rule=t.value;else if(k=='fs')S.fields[i].sec=t.value;else if(k=='bo')S.bonus.on=t.checked;else return;
 render();renderSet()});
SB.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,F=S.fields;
 if(a=='done'){show('#ovSet',false);return}
 if(a=='allclr'){twice(b,'Wirklich alle Daten löschen?',()=>{localStorage.removeItem(KEY);S=fresh();S.hist=[];render();renderSet()});return}
 if(a=='fstd'||a=='ystd'){const yatzy=a=='ystd';twice(b,'Wirklich wechseln?',()=>{S.fields=yatzy?stdYatzy():std();S.variant=yatzy?'yatzy':'kniffel';S.players.forEach(p=>p.s={});S.bonus={on:true,thr:63,val:yatzy?25:35};render();renderSet()});return}
 if(a=='padd'&&S.players.length<10)S.players.push(mk(S.players.length+1));
 else if(a=='pdel')S.players.splice(i,1);
 else if(a=='fadd')F.push({id:'x'+Date.now(),name:'Neues Feld',sec:'l',t:'f',v:20});
 else if(a=='fdel')F.splice(i,1);
 else if(a=='fup'&&i>0)[F[i-1],F[i]]=[F[i],F[i-1]];
 else if(a=='fdn'&&i<F.length-1)[F[i+1],F[i]]=[F[i],F[i+1]];
 else if(a=='pre'){const p=PRE[i];S.theme={accent:p[1],paper:p[2],ink:p[3]}}
 else if(a=='tres')S.theme=null;
 render();renderSet()});
const fmt=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
function stats(){if(VIEW!=2)return;const H=S.hist,el=$('#stats');
 if(!H.length){el.innerHTML='<p class="empty">Noch keine Spiele gespeichert. Sind alle Felder ausgefüllt, heißt der Knopf oben „Spiel speichern“. Danach erscheint hier die Auswertung.</p>';return}
 const M={},FN=[];
 H.forEach(g=>{const mx=Math.max(...g.p.map(x=>x.t));g.f.forEach(f=>{if(!FN.includes(f.n))FN.push(f.n)});
  g.p.forEach(x=>{const m=M[x.n]=M[x.n]||{g:0,w:0,sum:0,best:0,k:0,F:{}};m.g++;m.sum+=x.t;m.best=Math.max(m.best,x.t);if(x.t==mx)m.w++;
   g.f.forEach(f=>{const v=x.s[f.id];if(v==null)return;const a=m.F[f.n]=m.F[f.n]||[0,0];a[0]+=v;a[1]++;if(/^(kniffel|yatzy)$/i.test(f.n)&&v>0)m.k++})})});
 const N=Object.keys(M).sort((a,b)=>M[b].w-M[a].w||M[b].sum/M[b].g-M[a].sum/M[a].g);
 let h=`<h4>Rangliste (${H.length} Spiele)</h4><table><thead><tr><th class="lab">Spieler</th><th>Spiele</th><th>Siege</th><th>Quote</th><th>Ø Punkte</th><th>Bestwert</th><th>Kniffel / Yatzy</th></tr></thead><tbody>`+
 N.map(n=>{const m=M[n];return `<tr><th class="lab" scope="row">${esc(n)}</th><td>${m.g}</td><td>${m.w}</td><td>${Math.round(m.w/m.g*100)} %</td><td>${fmt(m.sum/m.g)}</td><td>${m.best}</td><td>${m.k}</td></tr>`}).join('')+'</tbody></table>';
 h+=`<h4>Durchschnitt pro Feld</h4><table><thead><tr><th class="lab">Feld</th>${N.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>`+
 FN.map(fn=>{const av=N.map(n=>{const a=M[n].F[fn];return a?a[0]/a[1]:null}),mx=Math.max(...av.map(v=>v==null?-1:v));
  return `<tr><th class="lab" scope="row">${esc(fn)}</th>${av.map(v=>`<td${v!=null&&v==mx&&N.length>1?' class="hi"':''}>${v==null?'–':fmt(v)}</td>`).join('')}</tr>`}).join('')+'</tbody></table>';
 h+='<h4>Letzte Spiele</h4><table><tbody>'+H.slice(-8).reverse().map(g=>{const mx=Math.max(...g.p.map(x=>x.t));
  return `<tr><th class="lab" scope="row">${new Date(g.d).toLocaleDateString('de-DE')}</th><td style="text-align:left;padding:0 10px;min-width:220px">${g.p.slice().sort((a,b)=>b.t-a.t).map(x=>x.t==mx?`<b>${esc(x.n)} ${x.t}</b>`:`${esc(x.n)} ${x.t}`).join(' · ')}</td></tr>`}).join('')+'</tbody></table>';
 h+='<div class="row" style="margin:12px 10px 0"><button class="bt warn" id="bClr">Statistik löschen</button></div>';
 el.innerHTML=h}
$('#stats').addEventListener('click',e=>{const b=e.target.closest('#bClr');if(b)twice(b,'Wirklich löschen?',()=>{S.hist=[];render()})});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;VIEW=+b.dataset.t;
 $('#t1').classList.toggle('on',VIEW==1);$('#t2').classList.toggle('on',VIEW==2);
 $('#blk').hidden=VIEW!=1;$('#rank').hidden=VIEW!=1;$('#stats').hidden=VIEW!=2;stats()});
render();
</script>


</body></html>
